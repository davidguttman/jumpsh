name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish (e.g. v1.0.0-rc.1)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}

    steps:
      - name: Check out the released version
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Resolve release prerelease setting
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PRERELEASE: ${{ github.event.release.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            prerelease="$EVENT_PRERELEASE"
          else
            prerelease="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')"
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install test fixture dependencies
        run: npm ci --prefix test/fixtures/apps/node-npm-vite

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify release metadata
        env:
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const expectedTag = `v${pkg.version}`;
          const isPrereleaseVersion = pkg.version.includes("-");
          const isPrereleaseRelease = process.env.IS_PRERELEASE === "true";

          if (process.env.RELEASE_TAG !== expectedTag) {
            throw new Error(
              `Release tag ${process.env.RELEASE_TAG} does not match package version ${pkg.version}`,
            );
          }

          if (isPrereleaseVersion !== isPrereleaseRelease) {
            throw new Error(
              "The GitHub release prerelease setting does not match the package version",
            );
          }
          NODE

      - name: Select npm distribution tag
        id: dist-tag
        env:
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        env:
          NPM_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: npm publish --tag "$NPM_TAG"
